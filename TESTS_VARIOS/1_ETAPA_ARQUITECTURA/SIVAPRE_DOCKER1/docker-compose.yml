# version: "3.9"

services:
  db:
    image: postgres:15
    container_name: sivapre_postgres
    restart: always
    environment:
      POSTGRES_DB: sivapre_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    container_name: sivapre_backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/sivapre_db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: sivapre_streamlit
    depends_on:
      - backend
    ports:
      - "8501:8501"

volumes:
  postgres_data:
